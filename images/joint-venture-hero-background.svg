<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1000" role="img" aria-label="Modern residential development with site-plan grid">
<defs>
 <linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071c15"/><stop offset=".52" stop-color="#123d2f"/><stop offset="1" stop-color="#1b0e06"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2ead3"/><stop offset=".45" stop-color="#a9c5b5"/><stop offset="1" stop-color="#446e5b"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f0d47a"/><stop offset="1" stop-color="#b98020"/></linearGradient>
 <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#d4a32c" stroke-opacity=".13" stroke-width="1"/></pattern>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020b07" flood-opacity=".45"/></filter>
</defs>
<rect width="1920" height="1000" fill="url(#base)"/>
